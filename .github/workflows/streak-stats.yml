name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger in Actions tab

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Streak Stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: syedsohailhussain1
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak-stats.svg
          theme: solarized-dark
          hide-border: true
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak-stats.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
